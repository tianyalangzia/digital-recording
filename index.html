<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资产</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #8a919f;
    --border: #e6e8eb;
    --primary: #3b7cff;
    --primary-dark: #2f66d6;
    --danger: #e5484d;
    --green: #30a46c;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 110px;
  }

  /* ===== 顶部资产卡片 ===== */
  .hero {
    background: linear-gradient(135deg, #3b7cff 0%, #6a5cff 60%, #8a5cff 100%);
    border-radius: 20px;
    padding: 20px 22px;
    color: #fff;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(59, 124, 255, 0.28);
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute; right: -40px; top: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; position: relative; z-index: 1; }
  .hero-title { font-size: 16px; font-weight: 600; opacity: 0.95; }
  .hero-actions { display: flex; gap: 8px; position: relative; z-index: 1; }
  .hero-btn {
    border: none; cursor: pointer; font-size: 13px; padding: 7px 14px; border-radius: 20px;
    background: rgba(255,255,255,0.22); color: #fff; font-weight: 500; transition: all .15s;
  }
  .hero-btn:hover { background: rgba(255,255,255,0.34); }
  .hero-stats { display: flex; position: relative; z-index: 1; }
  .hero-stat { flex: 1; }
  .hero-stat + .hero-stat { border-left: 1px solid rgba(255,255,255,0.25); padding-left: 22px; }
  .hero-stat .label { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
  .hero-stat .value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }

  /* ===== 分类筛选栏 ===== */
  .filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-icon { width: 34px; height: 34px; border-radius: 10px; background: #eef2ff; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .chip {
    flex-shrink: 0; padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
    background: #eceef1; color: #5a616c; border: none; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .chip:hover { background: #e2e5ea; }
  .chip.active { background: var(--primary); color: #fff; }
  .sort-btn { margin-left: auto; flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; background: #fff; border: 1px solid var(--border); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .15s; color: #5a616c; }
  .sort-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* ===== 搜索栏 ===== */
  .search-bar { margin-bottom: 16px; position: relative; }
  .search-bar input {
    width: 100%; padding: 11px 16px 11px 40px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 14px; outline: none; background: #fff; color: var(--text); transition: border .15s;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-bar .s-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--muted); }

  /* ===== 资产列表 ===== */
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .list-head .count { font-size: 13px; color: var(--muted); }
  .asset-list { display: flex; flex-direction: column; gap: 12px; }
  .asset-card {
    background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
    border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all .15s;
  }
  .asset-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .asset-icon {
    width: 48px; height: 48px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .asset-main { flex: 1; min-width: 0; }
  .asset-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .asset-sub { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .asset-right { text-align: right; flex-shrink: 0; }
  .asset-price { font-size: 15px; font-weight: 700; }
  .asset-daily { font-size: 12px; color: var(--green); margin-top: 2px; }
  .asset-days { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty .big { font-size: 52px; margin-bottom: 12px; }

  /* ===== 底部导航 ===== */
  .tabbar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 40px); max-width: 440px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border: 1px solid rgba(255,255,255,0.6);
    display: flex; z-index: 50; padding: 8px;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0;
    border: none; background: transparent; cursor: pointer; color: var(--muted); font-size: 11px; border-radius: 16px; transition: all .15s;
  }
  .tab .t-icon { font-size: 20px; line-height: 1; }
  .tab.active { color: var(--primary); background: #eef2ff; font-weight: 600; }

  /* ===== 弹窗 ===== */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; z-index: 1; }
  .modal-head h2 { font-size: 18px; font-weight: 600; }
  .modal-close { border: none; background: transparent; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
  .modal-body { padding: 20px 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-item { display: flex; flex-direction: column; gap: 6px; }
  .form-item.full { grid-column: 1 / -1; }
  .form-item label { font-size: 13px; color: #5a616c; font-weight: 500; }
  .form-item input, .form-item select, .form-item textarea {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
    outline: none; transition: border .15s; font-family: inherit; background: #fff; color: var(--text);
  }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--primary); }
  .form-item textarea { resize: vertical; min-height: 60px; }
  .form-item .required::after { content: " *"; color: var(--danger); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: #fff; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 10px;
    border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s; background: #fff; color: var(--text); border: 1px solid var(--border);
  }
  .btn:hover { border-color: #c9ced6; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn-danger { color: var(--danger); border-color: #f0c4c6; }

  /* ===== 详情 ===== */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .detail-item { display: flex; flex-direction: column; }
  .detail-item .k { font-size: 12px; color: var(--muted); }
  .detail-item .v { font-size: 14px; }
  .detail-item.full { grid-column: 1 / -1; }

  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 560px) {
    .form-grid, .detail-grid { grid-template-columns: 1fr; }
    .hero-stat .value { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部资产卡片 -->
  <div class="hero">
    <div class="hero-top">
      <span class="hero-title" id="heroTitle">我的资产</span>
      <div class="hero-actions">
        <button class="hero-btn" onclick="openAdd()">＋ 添加</button>
      </div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="label">总资产</div>
        <div class="value" id="totalAsset">¥0</div>
      </div>
      <div class="hero-stat">
        <div class="label">总日均</div>
        <div class="value" id="totalDaily">¥0</div>
      </div>
    </div>
  </div>

  <!-- 分类筛选 -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- 搜索 -->
  <div class="search-bar">
    <span class="s-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索设备名称 / 品牌 / 型号" oninput="render()">
  </div>

  <!-- 列表 -->
  <div class="list-head">
    <span class="count" id="listCount"></span>
  </div>
  <div class="asset-list" id="deviceList"></div>
</div>

<!-- 底部导航 -->
<div class="tabbar">
  <button class="tab active" onclick="switchTab(this, 'list')"><span class="t-icon">▦</span>资产</button>
  <button class="tab" onclick="switchTab(this, 'stats')"><span class="t-icon">◔</span>统计</button>
  <button class="tab" onclick="switchTab(this, 'fav')"><span class="t-icon">♡</span>收藏</button>
  <button class="tab" onclick="switchTab(this, 'mine')"><span class="t-icon">◉</span>我的</button>
</div>

<!-- 添加/编辑弹窗 -->
<div class="modal-mask" id="editModal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="editTitle">添加设备</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-item">
          <label class="required">设备名称</label>
          <input type="text" id="f_name" placeholder="如：iPhone 17">
        </div>
        <div class="form-item">
          <label>设备类型</label>
          <select id="f_type"></select>
        </div>
        <div class="form-item">
          <label>图标</label>
          <div id="iconPicker" style="display:flex;align-items:center;gap:8px">
            <div id="iconPreview" style="width:40px;height:40px;border-radius:10px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">📦</div>
            <button type="button" class="btn btn-sm" style="flex:1" onclick="openIconPanel()">选择图标</button>
            <button type="button" class="btn btn-sm" onclick="clearIcon()" title="清除自定义图标">清除</button>
          </div>
        </div>
        <div class="form-item">
          <label>品牌</label>
          <input type="text" id="f_brand" placeholder="如：Apple">
        </div>
        <div class="form-item">
          <label>型号</label>
          <input type="text" id="f_model" placeholder="如：A3402">
        </div>
        <div class="form-item">
          <label>购买日期</label>
          <input type="date" id="f_date">
        </div>
        <div class="form-item">
          <label>购买价格（元）</label>
          <input type="number" id="f_price" placeholder="0" min="0" step="0.01">
        </div>
        <div class="form-item">
          <label>购买渠道</label>
          <input type="text" id="f_channel" placeholder="如：京东 / 官方店">
        </div>
        <div class="form-item">
          <label>序列号 / IMEI</label>
          <input type="text" id="f_sn">
        </div>
        <div class="form-item">
          <label>使用状态</label>
          <select id="f_status">
            <option value="在用">在用</option>
            <option value="备用">备用</option>
            <option value="已出售">已出售</option>
            <option value="已报废">已报废</option>
          </select>
        </div>
        <div class="form-item">
          <label>收藏</label>
          <select id="f_fav">
            <option value="">否</option>
            <option value="1">是</option>
          </select>
        </div>
        <div class="form-item full">
          <label>备注</label>
          <textarea id="f_note" placeholder="其他想记录的信息..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveDevice()">保存</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <h2>设备详情</h2>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body">
      <div class="detail-grid" id="detailContent"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" onclick="deleteFromDetail()">删除</button>
      <button class="btn btn-primary" onclick="editFromDetail()">编辑</button>
    </div>
  </div>
</div>

<!-- 统计弹窗 -->
<div class="modal-mask" id="statsModal">
  <div class="modal">
    <div class="modal-head">
      <h2>资产统计</h2>
      <button class="modal-close" onclick="closeStats()">×</button>
    </div>
    <div class="modal-body">
      <div id="statsContent"></div>
    </div>
  </div>
</div>

<!-- 分类管理弹窗 -->
<div class="modal-mask" id="categoryModal">
  <div class="modal">
    <div class="modal-head">
      <h2>分类管理</h2>
      <button class="modal-close" onclick="closeCategoryMgr()">×</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input type="text" id="newCategory" placeholder="输入新分类名称" style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none" onkeydown="if(event.key==='Enter')addCategory()">
        <button class="btn btn-primary" onclick="addCategory()">添加</button>
      </div>
      <div id="categoryList" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </div>
</div>

<!-- 图标选择面板 -->
<div class="modal-mask" id="iconModal">
  <div class="modal">
    <div class="modal-head">
      <h2>选择图标</h2>
      <button class="modal-close" onclick="closeIconPanel()">×</button>
    </div>
    <div class="modal-body">
      <div id="iconGrid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"></div>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<script>
const API_BASE = '/api/data';
const DEFAULT_CATEGORIES = ['笔记本电脑', '手机', '平板', '耳机', '显示器', '硬盘', '键盘', '鼠标', '手柄', '相机', '智能手表', '其他'];
const STATUSES = ['在用', '备用', '已出售', '已报废'];

// 类型图标与配色
const TYPE_STYLE = {
  '笔记本电脑': { icon: '💻', bg: '#e8f0ff' },
  '手机': { icon: '📱', bg: '#e8f7ee' },
  '平板': { icon: '📟', bg: '#eef2ff' },
  '耳机': { icon: '🎧', bg: '#fdf0e7' },
  '显示器': { icon: '🖥', bg: '#e8f0ff' },
  '硬盘': { icon: '💾', bg: '#f0eefd' },
  '键盘': { icon: '⌨️', bg: '#eef2ff' },
  '鼠标': { icon: '🖱', bg: '#e8f7ee' },
  '手柄': { icon: '🎮', bg: '#fdeef4' },
  '相机': { icon: '📷', bg: '#fdf0e7' },
  '智能手表': { icon: '⌚', bg: '#e8f0ff' },
  '其他': { icon: '📦', bg: '#f2f3f5' }
};

// 预设图标库（添加设备时可选择）
const ICON_LIBRARY = [
  '📱', '💻', '🖥', '🖨', '📟', '⌨️', '🖱', '🖲', '🎧', '🎮',
  '📷', '📹', '📺', '⌚', '💾', '💿', '📀', '🖊', '🔋', '🔌',
  '🔊', '🎤', '🎙', '🛰', '📡', '📼', '📻', '📠', '☎️', '🕹',
  '🧮', '🔦', '🪫', '🖱️', '🖥️', '💽', '🧭', '🎛', '⏱', '⏰',
  '📲', '📳', '🖥️', '🖨️', '🖱️', '📷', '🎥', '🎞', '📽', '🛸',
  '💻', '🖥️', '⌨️', '🖱️', '📱', '⌚', '🎧', '📷', '🎮', '💾',
  '📦', '🔧', '⚙️', '🔩', '🪛', '📐', '📏', '🧰', '🔒', '🖍'
];

let devices = [];
let categories = [];
let editingId = null;
let viewingId = null;
let currentFilter = '';
let currentSort = 'daily_desc'; // daily_desc | daily_asc | price_desc | price_asc
let currentTab = 'list';
let selectedIcon = ''; // 当前表单中选中的图标

// ---------- 数据层（读写本地 data.json 文件） ----------
async function load() {
  try {
    const res = await fetch(API_BASE);
    const data = await res.json();
    if (data && Array.isArray(data.devices)) {
      devices = data.devices;
      categories = Array.isArray(data.categories) ? data.categories : [];
    } else {
      devices = [];
      categories = [];
    }
    // 若分类为空，用默认分类兜底
    if (categories.length === 0) {
      categories = [...DEFAULT_CATEGORIES];
    }
    // 保证所有设备已有的 type 都在分类里（防止旧数据有未知分类）
    devices.forEach(d => {
      if (d.type && !categories.includes(d.type)) categories.push(d.type);
    });
  } catch (e) {
    devices = [];
    categories = [...DEFAULT_CATEGORIES];
    toast('无法连接本地服务，请确认已启动 server.py');
  }
}
let _saveChain = Promise.resolve();
function save() {
  // 串行化写入，避免并发请求导致 data.json 内容乱序
  const snapshot = JSON.stringify({ devices, categories });
  _saveChain = _saveChain.then(async () => {
    try {
      await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: snapshot
      });
    } catch (e) {
      toast('保存失败，请确认本地服务已启动');
    }
  });
  return _saveChain;
}

// ---------- 计算工具 ----------
function usageDays(d) {
  if (!d.date) return 0;
  const start = new Date(d.date);
  const now = new Date();
  const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  return diff > 0 ? diff : 0;
}
function dailyCost(d) {
  const days = usageDays(d);
  if (!days) return 0;
  return (Number(d.price) || 0) / days;
}
function fmtMoney(n) {
  return '¥' + Number(n || 0).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
}
function fmtDaily(n) {
  return '¥' + Number(n || 0).toFixed(2) + '/天';
}
// 获取设备的图标和背景色：优先使用自定义 icon 字段，否则按类型匹配
function getIconStyle(d) {
  const fallback = TYPE_STYLE[d.type] || TYPE_STYLE['其他'];
  if (d.icon) {
    return { icon: d.icon, bg: fallback.bg };
  }
  return fallback;
}

// ---------- 渲染 ----------
function render() {
  renderHero();
  renderFilterBar();
  renderList();
}

function renderHero() {
  const total = devices.reduce((s, d) => s + (Number(d.price) || 0), 0);
  const totalDaily = devices.reduce((s, d) => s + dailyCost(d), 0);
  document.getElementById('totalAsset').textContent = fmtMoney(total);
  document.getElementById('totalDaily').textContent = fmtDaily(totalDaily);
  const inUse = devices.filter(d => d.status === '在用').length;
  document.getElementById('heroTitle').textContent = `我的资产 ${inUse}/${devices.length}`;
}

function renderFilterBar() {
  const el = document.getElementById('filterBar');
  const chips = ['全部', ...categories];
  el.innerHTML = `
    <div class="filter-icon" title="分类管理" onclick="openCategoryMgr()" style="cursor:pointer">⚙</div>
    ${chips.map((t, i) => `<button class="chip ${currentFilter === t ? 'active' : ''}" onclick="setFilterByIdx(${i})">${esc(t)}</button>`).join('')}
    <button class="sort-btn" title="切换排序" onclick="cycleSort()">${sortIcon()}</button>
  `;
}

function sortIcon() {
  return currentSort.includes('price') ? '¥↓' : '↑↓';
}

function renderList() {
  const el = document.getElementById('deviceList');
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();

  let list = devices.filter(d => {
    if (currentFilter && currentFilter !== '全部' && d.type !== currentFilter) return false;
    if (kw) {
      const hay = (d.name + ' ' + (d.brand||'') + ' ' + (d.model||'')).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });

  // 收藏 tab
  if (currentTab === 'fav') list = list.filter(d => d.fav === '1');

  // 排序
  list.sort((a, b) => {
    switch (currentSort) {
      case 'daily_asc': return dailyCost(a) - dailyCost(b);
      case 'price_desc': return (Number(b.price)||0) - (Number(a.price)||0);
      case 'price_asc': return (Number(a.price)||0) - (Number(b.price)||0);
      case 'daily_desc':
      default: return dailyCost(b) - dailyCost(a);
    }
  });

  document.getElementById('listCount').textContent = `共 ${list.length} 件资产`;

  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="big">${devices.length === 0 ? '📦' : '🔍'}</div><p>${devices.length === 0 ? '还没有记录设备，点击右上角"添加"开始吧' : (currentTab === 'fav' ? '还没有收藏的设备' : '没有符合条件的设备')}</p></div>`;
    return;
  }

  el.innerHTML = list.map(d => {
    const st = getIconStyle(d);
    const days = usageDays(d);
    const daily = dailyCost(d);
    const sub = [d.brand, d.model].filter(Boolean).join(' · ') || d.status;
    return `
    <div class="asset-card" onclick="openDetail('${d.id}')">
      <div class="asset-icon" style="background:${st.bg}">${st.icon}</div>
      <div class="asset-main">
        <div class="asset-name">${esc(d.name)}${d.fav === '1' ? ' <span style="color:#e5484d">♥</span>' : ''}</div>
        <div class="asset-sub">${esc(sub)}</div>
      </div>
      <div class="asset-right">
        <div class="asset-price">${fmtMoney(d.price)}</div>
        <div class="asset-daily">${fmtDaily(daily)}</div>
        <div class="asset-days">${days ? days + ' 天' : '—'}</div>
      </div>
    </div>`;
  }).join('');
}

// ---------- 筛选 / 排序 ----------
function setFilterByIdx(idx) {
  currentFilter = idx === 0 ? '全部' : (categories[idx - 1] || '全部');
  render();
}
function setFilter(t) {
  currentFilter = t;
  render();
}
function cycleSort() {
  const order = ['daily_desc', 'daily_asc', 'price_desc', 'price_asc'];
  const i = order.indexOf(currentSort);
  currentSort = order[(i + 1) % order.length];
  render();
}

// ---------- 底部导航 ----------
function switchTab(btn, tab) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = tab;

  if (tab === 'stats') {
    openStats();
    currentTab = 'list';
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelector('.tab:first-child').classList.add('active');
    return;
  }
  if (tab === 'mine') {
    // 我的：导出/导入
    showMine();
    return;
  }
  render();
}

function showMine() {
  const html = `
    <div style="display:flex;flex-direction:column;gap:12px;padding:8px 0">
      <button class="btn" style="justify-content:flex-start" onclick="exportData()">📤 导出备份（JSON）</button>
      <button class="btn" style="justify-content:flex-start" onclick="importData()">📥 导入备份（JSON）</button>
      <button class="btn" style="justify-content:flex-start" onclick="clearAll()">🗑 清空所有数据</button>
    </div>`;
  document.getElementById('deviceList').innerHTML = `<div style="background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)">${html}</div>`;
  document.getElementById('listCount').textContent = '';
  // 保持"资产" tab 高亮
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelector('.tab:first-child').classList.add('active');
  currentTab = 'list';
}

function openStats() {
  const total = devices.length;
  const inUse = devices.filter(d => d.status === '在用').length;
  const standby = devices.filter(d => d.status === '备用').length;
  const sold = devices.filter(d => d.status === '已出售').length;
  const scrapped = devices.filter(d => d.status === '已报废').length;
  const invested = devices.reduce((s, d) => s + (Number(d.price) || 0), 0);
  const avgPrice = total ? invested / total : 0;

  // 分类统计
  const typeMap = {};
  devices.forEach(d => { typeMap[d.type] = (typeMap[d.type] || 0) + 1; });
  const typeRows = Object.entries(typeMap).sort((a,b)=>b[1]-a[1])
    .map(([t, c]) => {
      const st = TYPE_STYLE[t] || TYPE_STYLE['其他'];
      const sum = devices.filter(d => d.type === t).reduce((s,d)=>s+(Number(d.price)||0),0);
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f1f3">
        <span style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${st.bg}">${st.icon}</span>
        <span style="flex:1;font-size:14px">${t}</span>
        <span style="font-size:13px;color:var(--muted)">${c} 件</span>
        <span style="font-size:14px;font-weight:600;min-width:80px;text-align:right">${fmtMoney(sum)}</span>
      </div>`;
    }).join('');

  document.getElementById('statsContent').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px">
      <div style="background:#f4f5f7;border-radius:12px;padding:14px"><div style="font-size:22px;font-weight:700">${total}</div><div style="font-size:12px;color:var(--muted)">设备总数</div></div>
      <div style="background:#f4f5f7;border-radius:12px;padding:14px"><div style="font-size:22px;font-weight:700">${inUse}</div><div style="font-size:12px;color:var(--muted)">在用</div></div>
      <div style="background:#f4f5f7;border-radius:12px;padding:14px"><div style="font-size:22px;font-weight:700">${fmtMoney(invested)}</div><div style="font-size:12px;color:var(--muted)">累计投入</div></div>
      <div style="background:#f4f5f7;border-radius:12px;padding:14px"><div style="font-size:22px;font-weight:700">${fmtMoney(avgPrice)}</div><div style="font-size:12px;color:var(--muted)">平均单价</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
      <span style="font-size:12px;padding:4px 12px;border-radius:14px;background:#e8f7ee;color:var(--green)">在用 ${inUse}</span>
      <span style="font-size:12px;padding:4px 12px;border-radius:14px;background:#fff6e5;color:#b8860b">备用 ${standby}</span>
      <span style="font-size:12px;padding:4px 12px;border-radius:14px;background:#eef2ff;color:#5b6b9a">已出售 ${sold}</span>
      <span style="font-size:12px;padding:4px 12px;border-radius:14px;background:#fdecec;color:#c0392b">已报废 ${scrapped}</span>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:8px">分类统计</div>
    ${typeRows || '<div style="color:var(--muted);font-size:13px">暂无数据</div>'}
  `;
  document.getElementById('statsModal').classList.add('show');
}
function closeStats() { document.getElementById('statsModal').classList.remove('show'); }

// ---------- 图标选择 ----------
function openIconPanel() {
  renderIconGrid();
  document.getElementById('iconModal').classList.add('show');
}
function closeIconPanel() { document.getElementById('iconModal').classList.remove('show'); }
function renderIconGrid() {
  const el = document.getElementById('iconGrid');
  el.innerHTML = ICON_LIBRARY.map(icon => `
    <button type="button" onclick="selectIcon('${icon}')" style="
      width:100%;aspect-ratio:1;font-size:26px;border:1px solid var(--border);border-radius:12px;
      background:${selectedIcon === icon ? '#eef2ff' : '#fff'};cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all .15s;outline:none;${selectedIcon === icon ? 'border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,124,255,.2)' : ''}
    ">${icon}</button>
  `).join('');
}
function selectIcon(icon) {
  selectedIcon = icon;
  updateIconPreview();
  renderIconGrid();
  closeIconPanel();
}
function clearIcon() {
  selectedIcon = '';
  updateIconPreview();
}
function updateIconPreview() {
  const el = document.getElementById('iconPreview');
  const type = document.getElementById('f_type') ? document.getElementById('f_type').value : '';
  const fallback = TYPE_STYLE[type] || TYPE_STYLE['其他'];
  el.textContent = selectedIcon || fallback.icon;
  el.style.background = fallback.bg;
}

// ---------- 分类管理 ----------
function openCategoryMgr() {
  renderCategoryList();
  document.getElementById('newCategory').value = '';
  document.getElementById('categoryModal').classList.add('show');
}
function closeCategoryMgr() { document.getElementById('categoryModal').classList.remove('show'); }
function renderCategoryList() {
  const el = document.getElementById('categoryList');
  el.innerHTML = categories.map((t, i) => {
    const cnt = devices.filter(d => d.type === t).length;
    const st = TYPE_STYLE[t] || { icon: '📦', bg: '#f2f3f5' };
    return `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f7f8fa;border-radius:10px">
      <span style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${st.bg};font-size:16px">${st.icon}</span>
      <span style="flex:1;font-size:14px">${esc(t)}</span>
      <span style="font-size:12px;color:var(--muted)">${cnt} 件</span>
      <button class="icon-btn del" style="font-size:16px" title="删除分类" onclick="removeCategory(${i})">🗑</button>
    </div>`;
  }).join('');
}
function addCategory() {
  const input = document.getElementById('newCategory');
  const name = input.value.trim();
  if (!name) { toast('请输入分类名称'); return; }
  if (categories.includes(name)) { toast('该分类已存在'); return; }
  categories.push(name);
  input.value = '';
  renderCategoryList();
  renderTypeOptions();
  render();
  save();
  toast('已添加分类');
}
function removeCategory(idx) {
  const name = categories[idx];
  const cnt = devices.filter(d => d.type === name).length;
  if (cnt > 0) {
    if (!confirm(`分类"${name}"下有 ${cnt} 件设备，删除后这些设备将变为"其他"分类。确定删除吗？`)) return;
    devices.forEach(d => { if (d.type === name) d.type = '其他'; });
    if (!categories.includes('其他')) categories.push('其他');
  }
  categories.splice(idx, 1);
  if (categories.length === 0) categories = ['其他'];
  if (currentFilter === name) currentFilter = '全部';
  renderCategoryList();
  renderTypeOptions();
  render();
  save();
  toast('已删除分类');
}

function clearAll() {
  if (!confirm('确定清空所有设备数据吗？此操作不可恢复，建议先导出备份。')) return;
  devices = [];
  save();
  render();
  toast('已清空');
}

// ---------- 添加 / 编辑 ----------
function openAdd() {
  editingId = null;
  document.getElementById('editTitle').textContent = '添加设备';
  renderTypeOptions();
  clearForm();
  document.getElementById('editModal').classList.add('show');
}
function openEdit(id) {
  const d = devices.find(x => x.id === id);
  if (!d) return;
  editingId = id;
  document.getElementById('editTitle').textContent = '编辑设备';
  renderTypeOptions();
  fillForm(d);
  document.getElementById('editModal').classList.add('show');
  if (viewingId) closeDetail();
}
function saveDevice() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) { toast('请填写设备名称'); return; }

  const data = {
    name,
    type: document.getElementById('f_type').value,
    icon: selectedIcon,
    brand: document.getElementById('f_brand').value.trim(),
    model: document.getElementById('f_model').value.trim(),
    date: document.getElementById('f_date').value,
    price: document.getElementById('f_price').value,
    channel: document.getElementById('f_channel').value.trim(),
    sn: document.getElementById('f_sn').value.trim(),
    status: document.getElementById('f_status').value,
    fav: document.getElementById('f_fav').value,
    note: document.getElementById('f_note').value.trim()
  };

  if (editingId) {
    const idx = devices.findIndex(x => x.id === editingId);
    if (idx >= 0) devices[idx] = { ...devices[idx], ...data };
    toast('已更新');
  } else {
    data.id = genId();
    data.createdAt = Date.now();
    devices.unshift(data);
    toast('已添加');
  }
  save();
  closeModal();
  render();
}

function removeDevice(id) {
  const d = devices.find(x => x.id === id);
  if (!d) return;
  if (!confirm(`确定删除"${d.name}"吗？此操作不可恢复。`)) return;
  devices = devices.filter(x => x.id !== id);
  save();
  render();
  toast('已删除');
}

// ---------- 详情 ----------
function openDetail(id) {
  const d = devices.find(x => x.id === id);
  if (!d) return;
  viewingId = id;
  const days = usageDays(d);
  const daily = dailyCost(d);
  const items = [
    ['设备名称', d.name],
    ['设备类型', d.type],
    ['品牌', d.brand || '—'],
    ['型号', d.model || '—'],
    ['使用状态', d.status],
    ['购买日期', d.date || '—'],
    ['购买价格', fmtMoney(d.price)],
    ['使用天数', days ? days + ' 天' : '—'],
    ['日均成本', fmtDaily(daily)],
    ['购买渠道', d.channel || '—'],
    ['序列号 / IMEI', d.sn || '—'],
    ['收藏', d.fav === '1' ? '♥ 已收藏' : '否'],
  ];
  const html = items.map(([k, v]) => `<div class="detail-item"><span class="k">${k}</span><span class="v">${esc(String(v))}</span></div>`).join('')
    + `<div class="detail-item full"><span class="k">备注</span><span class="v">${esc(d.note || '—')}</span></div>`;
  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
}
function editFromDetail() {
  if (viewingId) openEdit(viewingId);
}
function deleteFromDetail() {
  if (viewingId) { removeDevice(viewingId); closeDetail(); }
}
function closeDetail() { document.getElementById('detailModal').classList.remove('show'); viewingId = null; }

// ---------- 表单辅助 ----------
function renderTypeOptions() {
  const sel = document.getElementById('f_type');
  sel.innerHTML = categories.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
}
function clearForm() {
  ['f_name','f_brand','f_model','f_date','f_price','f_channel','f_sn','f_note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_type').value = categories[0] || '';
  document.getElementById('f_status').value = '在用';
  document.getElementById('f_fav').value = '';
  selectedIcon = '';
  updateIconPreview();
}
function fillForm(d) {
  document.getElementById('f_name').value = d.name || '';
  document.getElementById('f_type').value = d.type || categories[0] || '';
  document.getElementById('f_brand').value = d.brand || '';
  document.getElementById('f_model').value = d.model || '';
  document.getElementById('f_date').value = d.date || '';
  document.getElementById('f_price').value = d.price || '';
  document.getElementById('f_channel').value = d.channel || '';
  document.getElementById('f_sn').value = d.sn || '';
  document.getElementById('f_status').value = d.status || '在用';
  document.getElementById('f_fav').value = d.fav || '';
  document.getElementById('f_note').value = d.note || '';
  selectedIcon = d.icon || '';
  updateIconPreview();
}
function closeModal() { document.getElementById('editModal').classList.remove('show'); editingId = null; }

// ---------- 导出 / 导入 ----------
function exportData() {
  const payload = { devices, categories };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `我的资产备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出备份文件');
}
function importData() {
  document.getElementById('importFile').click();
}
document.getElementById('importFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const data = JSON.parse(reader.result);
      let newDevices, newCategories;
      if (Array.isArray(data)) {
        // 旧格式：纯设备数组
        newDevices = data;
        newCategories = [...DEFAULT_CATEGORIES];
      } else if (data && Array.isArray(data.devices)) {
        newDevices = data.devices;
        newCategories = Array.isArray(data.categories) && data.categories.length ? data.categories : [...DEFAULT_CATEGORIES];
      } else {
        throw new Error('格式错误');
      }
      if (!confirm(`将导入 ${newDevices.length} 件资产，是否覆盖当前数据？`)) return;
      devices = newDevices.map(d => ({ ...d, id: d.id || genId() }));
      categories = newCategories;
      // 保证设备类型都在分类里
      devices.forEach(d => { if (d.type && !categories.includes(d.type)) categories.push(d.type); });
      renderTypeOptions();
      save();
      render();
      toast('导入成功');
    } catch (err) {
      toast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ---------- 工具 ----------
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// 点击遮罩关闭
document.getElementById('editModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('detailModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeDetail(); });
document.getElementById('statsModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeStats(); });
document.getElementById('categoryModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeCategoryMgr(); });
document.getElementById('iconModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeIconPanel(); });

// 设备类型变化时，同步更新图标预览（未选自定义图标时跟随类型）
document.getElementById('f_type').addEventListener('change', function() {
  if (!selectedIcon) updateIconPreview();
});

// 初始化
(async function init() {
  await load();
  renderTypeOptions();
  render();
})();
</script>
</body>
</html>
